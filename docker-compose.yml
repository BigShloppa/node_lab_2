services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      PGHOST: db
      PGUSER: notes
      PGPASSWORD: notes
      PGDATABASE: notes
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads: