<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заметки — SPA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>📝 Мои заметки</h1></header>
  <main>
    <section class="form-section">
      <h2>Новая заметка</h2>
      <form id="note-form" enctype="multipart/form-data">
        <label>Заголовок
          <input type="text" name="title" required maxlength="200">
        </label>
        <label>Содержимое
          <textarea name="content" required maxlength="5000" rows="4"></textarea>
        </label>
        <label>Картинка (png/jpg/webp/gif, до 5 МБ)
          <input type="file" name="image" accept="image/*">
        </label>
        <div class="form-actions">
          <button type="submit">Добавить</button>
          <button type="button" id="cancel-edit" style="display:none">Отмена</button>
        </div>
      </form>
      <div id="msg" class="msg"></div>
    </section>
    <section>
      <h2>Список</h2>
      <div id="list" class="list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
